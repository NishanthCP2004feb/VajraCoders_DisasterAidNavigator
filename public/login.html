<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — CrisisIQ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;background:#0f172a;position:relative;overflow:hidden}
    body::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(124,58,237,0.15),transparent 70%);top:-100px;right:-100px;pointer-events:none}
    body::after{content:'';position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(37,99,235,0.1),transparent 70%);bottom:-100px;left:-100px;pointer-events:none}

    .login-container{width:100%;max-width:460px;padding:20px;z-index:1}
    .login-card{background:rgba(30,41,59,0.8);backdrop-filter:blur(20px);border:1px solid rgba(148,163,184,0.12);border-radius:20px;padding:40px 36px;box-shadow:0 20px 60px rgba(0,0,0,0.4)}

    .brand{text-align:center;margin-bottom:32px}
    .brand-icon{width:64px;height:64px;background:linear-gradient(135deg,#7c3aed,#2563eb);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 14px;box-shadow:0 8px 24px rgba(124,58,237,0.3)}
    .brand-name{font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,#e2e8f0,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px}
    .brand-sub{font-size:0.78rem;color:#64748b;margin-top:4px}

    .role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px;background:rgba(15,23,42,0.5);border-radius:12px;padding:4px}
    .role-tab{padding:12px;border-radius:10px;border:none;background:transparent;color:#94a3b8;font-size:0.85rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:8px}
    .role-tab:hover{color:#e2e8f0}
    .role-tab.active{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;box-shadow:0 4px 12px rgba(124,58,237,0.3)}
    .role-tab.active.public-active{background:linear-gradient(135deg,#2563eb,#1d4ed8);box-shadow:0 4px 12px rgba(37,99,235,0.3)}

    .form-group{margin-bottom:16px}
    .form-label{display:block;font-size:0.75rem;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
    .form-input{width:100%;padding:12px 16px;background:rgba(15,23,42,0.6);border:1px solid rgba(148,163,184,0.15);border-radius:10px;color:#e2e8f0;font-size:0.9rem;font-family:'Inter',sans-serif;transition:all 0.2s;outline:none}
    .form-input:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,0.15)}
    .form-input::placeholder{color:#475569}

    .btn-login{width:100%;padding:14px;border:none;border-radius:12px;font-size:0.95rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
    .btn-login.admin{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;box-shadow:0 4px 16px rgba(124,58,237,0.3)}
    .btn-login.admin:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,0.4)}
    .btn-login.public{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 4px 16px rgba(37,99,235,0.3)}
    .btn-login.public:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(37,99,235,0.4)}

    .error-msg{background:rgba(220,38,38,0.1);border:1px solid rgba(220,38,38,0.2);color:#fca5a5;padding:10px 14px;border-radius:8px;font-size:0.78rem;text-align:center;display:none;margin-bottom:14px}

    .demo-creds{background:rgba(124,58,237,0.06);border:1px solid rgba(124,58,237,0.15);border-radius:10px;padding:12px 16px;margin-top:16px}
    .demo-creds-title{font-size:0.72rem;font-weight:700;color:#7c3aed;margin-bottom:6px}
    .demo-creds-row{font-size:0.72rem;color:#94a3b8;font-family:'JetBrains Mono',monospace;line-height:1.8}
    .demo-creds-row b{color:#e2e8f0}

    .access-info{margin-top:20px;text-align:center}
    .access-info-text{font-size:0.7rem;color:#475569;line-height:1.6}
    .access-count{font-weight:700;color:#94a3b8}

    .particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .particle{position:absolute;width:3px;height:3px;background:#7c3aed;border-radius:50%;opacity:0.3;animation:float-up linear infinite}
    @keyframes float-up{0%{transform:translateY(100vh) scale(0);opacity:0}50%{opacity:0.4}100%{transform:translateY(-10vh) scale(1);opacity:0}}
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="brand">
        <div class="brand-icon">🚨</div>
        <div class="brand-name">CrisisIQ</div>
        <div class="brand-sub">AI-Powered Disaster Response Platform v3.5</div>
      </div>

      <div class="role-tabs">
        <button class="role-tab active" id="tab-admin" onclick="switchRole('admin')">🛡️ Admin</button>
        <button class="role-tab" id="tab-public" onclick="switchRole('public')">👥 Public</button>
      </div>

      <div class="error-msg" id="error-msg"></div>

      <!-- Admin Login Form -->
      <div id="form-admin">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" class="form-input" id="admin-user" placeholder="Enter admin username" autocomplete="off"/>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="admin-pass" placeholder="Enter password"/>
        </div>
        <div class="form-group">
          <label class="form-label">Access Code</label>
          <input type="text" class="form-input" id="admin-code" placeholder="Agency access code"/>
        </div>
        <button class="btn-login admin" id="btn-admin-login" onclick="loginAdmin()">🔐 Secure Login</button>



      </div>

      <!-- Public Login Form -->
      <div id="form-public" style="display:none">
        <div class="form-group">
          <label class="form-label">Your Name</label>
          <input type="text" class="form-input" id="public-name" placeholder="Enter your full name"/>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-input" id="public-phone" placeholder="e.g. 9876543210"/>
        </div>
        <button class="btn-login public" onclick="loginPublic()">🚀 Enter as Citizen</button>
      </div>

      <div class="access-info">
        <div class="access-info-text" id="access-info">
          🛡️ <span class="access-count">Admin Access</span> — Full platform control with all <span class="access-count">21 modules</span><br/>
          Command Center, AI Engine, Drone Dispatch, Ledger & more
        </div>
      </div>
    </div>
  </div>

  <script>
    // Particles
    const particles=document.getElementById('particles');
    for(let i=0;i<25;i++){
      const p=document.createElement('div');
      p.className='particle';
      p.style.left=Math.random()*100+'%';
      p.style.animationDuration=(8+Math.random()*12)+'s';
      p.style.animationDelay=Math.random()*8+'s';
      p.style.width=p.style.height=(2+Math.random()*3)+'px';
      particles.appendChild(p);
    }

    let currentRole='admin';

    function switchRole(role){
      currentRole=role;
      document.getElementById('tab-admin').className='role-tab'+(role==='admin'?' active':'');
      document.getElementById('tab-public').className='role-tab'+(role==='public'?' active public-active':'');
      document.getElementById('form-admin').style.display=role==='admin'?'block':'none';
      document.getElementById('form-public').style.display=role==='public'?'block':'none';
      document.getElementById('error-msg').style.display='none';

      document.getElementById('access-info').innerHTML=role==='admin'
        ?'🛡️ <span class="access-count">Admin Access</span> — Full platform control with all <span class="access-count">21 modules</span><br/>Command Center, AI Engine, Drone Dispatch, Ledger & more'
        :'👥 <span class="access-count">Public Access</span> — Citizen portal with <span class="access-count">6 modules</span><br/>SOS Beacon, Volunteer Registration, Offline Mesh & more';
    }

    // Admin credentials
    const ADMIN_CREDS=[
      {user:'admin',pass:'admin123',code:'CRISIS2026',name:'System Administrator'},
      {user:'police',pass:'police123',code:'CRISIS2026',name:'Police Command'},
      {user:'rescue',pass:'rescue123',code:'CRISIS2026',name:'Rescue Operations'},
      {user:'govt',pass:'govt123',code:'CRISIS2026',name:'Government Authority'}
    ];

    function loginAdmin(){
      const user=document.getElementById('admin-user').value.trim().toLowerCase();
      const pass=document.getElementById('admin-pass').value;
      const code=document.getElementById('admin-code').value.trim().toUpperCase();
      const err=document.getElementById('error-msg');

      if(!user||!pass||!code){err.textContent='⚠️ All fields are required.';err.style.display='block';return;}

      const match=ADMIN_CREDS.find(c=>c.user===user&&c.pass===pass&&c.code===code);
      if(!match){err.textContent='❌ Invalid credentials or access code.';err.style.display='block';return;}

      sessionStorage.setItem('crisisiq_role','admin');
      sessionStorage.setItem('crisisiq_user',match.name);
      sessionStorage.setItem('crisisiq_login',new Date().toISOString());
      window.location.href='/index.html';
    }

    function loginPublic(){
      const name=document.getElementById('public-name').value.trim();
      const phone=document.getElementById('public-phone').value.trim();
      const err=document.getElementById('error-msg');

      if(!name||!phone){err.textContent='⚠️ Name and phone number are required.';err.style.display='block';return;}
      if(phone.length<10){err.textContent='⚠️ Enter a valid phone number.';err.style.display='block';return;}

      sessionStorage.setItem('crisisiq_role','public');
      sessionStorage.setItem('crisisiq_user',name);
      sessionStorage.setItem('crisisiq_phone',phone);
      sessionStorage.setItem('crisisiq_login',new Date().toISOString());
      window.location.href='/index.html';
    }

    // Enter key support
    document.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        if(currentRole==='admin')loginAdmin();
        else loginPublic();
      }
    });

    // If already logged in, redirect
    if(sessionStorage.getItem('crisisiq_role')){
      window.location.href='/index.html';
    }
  </script>
</body>
</html>
