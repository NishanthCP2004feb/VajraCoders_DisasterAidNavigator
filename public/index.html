<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DisasterAid Navigator</title>
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="app-header">
      <a class="brand-link" href="/" data-route>
        <span class="brand-mark"><i data-lucide="shield-alert"></i></span>
        <span>
          <small>Emergency command center</small>
          <strong>DisasterAid Navigator</strong>
        </span>
      </a>
      <nav class="top-nav" aria-label="Primary navigation">
        <a href="/" data-route>Dashboard</a>
        <a href="/features/operations" data-route>Operations</a>
        <a href="/features/command-report" data-route>Report</a>
      </nav>
      <div class="header-actions">
        <span id="dataStatus" class="status-pill">Loading intelligence</span>
        <button id="refreshBtn" class="icon-button" type="button" title="Refresh plan" aria-label="Refresh plan">
          <i data-lucide="refresh-cw"></i>
        </button>
      </div>
    </header>

    <main id="pageRoot" class="app-shell" tabindex="-1"></main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/app.js"></script>
  </body>
</html>
